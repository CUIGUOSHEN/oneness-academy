<script src="assets/js/member-data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.ONENESS_DATA;

  function getSess() {
    try { return JSON.parse(localStorage.getItem('oneness_login') || 'null'); }
    catch (e) { return null; }
  }
  var sess = getSess();

  /* 导航头像（与 member-home 同一套简化版） */
  var navAuth = document.getElementById('nav-auth');
  if (sess && sess.user) {
    var initial = (sess.name || sess.user).charAt(0);
    navAuth.innerHTML =
      '<a class="nav-member-mini" href="member-home.html">' +
        '<span class="avatar">' + initial + '</span>' +
        '<span class="avatar-name">' + (sess.name || sess.user) + '</span>' +
      '</a>';
  }

  /* 解析参数 */
  var qs = new URLSearchParams(location.search);
  var cid = qs.get('c'), lno = qs.get('l');
  var course = D.COURSES.find(function (c) { return c.id === cid; });
  var inner = document.getElementById('cw-inner');

  if (!sess || !sess.user) {
    inner.innerHTML =
      '<div class="mh-guest-card cw-guest">' +
        '<h2>请先登录</h2><p>登录后即可观看课程回放。</p>' +
        '<div class="mh-guest-actions"><a class="mh-btn mh-btn-primary" href="member-home.html">前往客户界面</a></div>' +
      '</div>';
    return;
  }
  if (!course) {
    inner.innerHTML = '<div class="mh-guest-card cw-guest"><h2>未找到课程</h2>' +
      '<div class="mh-guest-actions"><a class="mh-btn mh-btn-ghost" href="member-home.html">返回我的课程</a></div></div>';
    return;
  }
  if (sess.tags.indexOf(course.tag) < 0) {
    inner.innerHTML = '<div class="mh-guest-card cw-guest"><h2>本课程未包含在您的标签中</h2>' +
      '<p>如需开通，请联系小管家。</p>' +
      '<div class="mh-guest-actions"><a class="mh-btn mh-btn-ghost" href="member-home.html">返回我的课程</a></div></div>';
    return;
  }

  var idx = course.lessons.findIndex(function (l) { return l.no === lno; });
  if (idx < 0) idx = 0;
  var lesson = course.lessons[idx];

  var rkey = 'oneness_replay_' + course.id + '_' + lesson.no;
  var replay = localStorage.getItem(rkey) || lesson.replay || '';

  /* 渲染 */
  var prev = course.lessons[idx - 1], next = course.lessons[idx + 1];
  inner.innerHTML =
    '<nav class="cw-crumb"><a href="member-home.html">我的课程</a><span> / </span><a href="member-home.html">' + course.title + '</a></nav>' +
    '<header class="cw-head" style="--accent:' + course.color + '">' +
      '<span class="cw-no">第 ' + lesson.no + ' 讲</span>' +
      '<h1>' + lesson.title + '</h1>' +
      '<p class="cw-sub">' + course.title + ' · ' + course.en + '</p>' +
    '</header>' +

    '<section class="cw-replay" style="--accent:' + course.color + '">' +
      '<h2>课程回放</h2>' +
      (replay
        ? '<a class="cw-watch" href="' + replay + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
          '观看腾讯会议回放</a>' +
          '<p class="cw-link">回放链接：<span>' + replay + '</span></p>'
        : '<p class="cw-pending">回放链接待上传——管理员可在下方「课程内容设置」中粘贴腾讯会议回放链接。</p>') +
    '</section>' +

    (lesson.page
      ? '<section class="cw-notes"><h2>图文讲义</h2>' +
        '<a class="cw-notes-link" href="' + lesson.page + '">阅读本期图文讲义《' + lesson.title + '》 &gt;</a></section>'
      : '') +

    (sess.isAdmin
      ? '<section class="cw-admin"><h2>课程内容设置 <i>（仅管理员可见）</i></h2>' +
        '<p class="cw-admin-tip">将腾讯会议课程回放链接粘贴到下面，保存后本页即显示「观看回放」入口。</p>' +
        '<div class="cw-admin-row">' +
          '<input type="url" id="replay-input" placeholder="https://meeting.tencent.com/..." value="' + replay + '">' +
          '<button type="button" id="replay-save">保存</button>' +
        '</div>' +
        '<p class="cw-admin-status" id="replay-status"></p></section>'
      : '') +

    '<nav class="cw-pager">' +
      (prev ? '<a href="course.html?c=' + course.id + '&l=' + prev.no + '">&lt; 上一讲 · ' + prev.title + '</a>' : '<span></span>') +
      (next ? '<a href="course.html?c=' + course.id + '&l=' + next.no + '">下一讲 · ' + next.title + ' &gt;</a>' : '<span></span>') +
    '</nav>' +

    '<section class="cw-all"><h2>本课程全部课时</h2><div class="lesson-list">' +
      course.lessons.map(function (l) {
        var rp = localStorage.getItem('oneness_replay_' + course.id + '_' + l.no) || l.replay || '';
        return '<a class="lesson-row' + (l.no === lesson.no ? ' current' : '') + '" style="--accent:' + course.color + '" href="course.html?c=' + course.id + '&l=' + l.no + '">' +
          '<span class="lesson-no">' + l.no + '</span>' +
          '<span class="lesson-title">' + l.title + '</span>' +
          '<span class="lesson-badge ' + (rp ? 'has' : '') + '">' + (rp ? '回放已就绪' : '回放待上传') + '</span>' +
          '<span class="lesson-go">观看 &gt;</span></a>';
      }).join('') +
    '</div></section>';

  /* 管理员保存回放链接 */
  var saveBtn = document.getElementById('replay-save');
  if (saveBtn) {
    saveBtn.addEventListener('click', function () {
      var v = document.getElementById('replay-input').value.trim();
      if (v) localStorage.setItem(rkey, v); else localStorage.removeItem(rkey);
      document.getElementById('replay-status').textContent = '已保存，正在刷新…';
      setTimeout(function () { location.reload(); }, 400);
    });
  }
})();
</script>
