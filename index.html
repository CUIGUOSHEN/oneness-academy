<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 网站建设中</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #ffffff;
    color: #111;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    text-align: center;
    padding: 0 24px;
  }
  .mark {
    font-size: clamp(72px, 18vw, 160px);
    font-weight: 200;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #d0021b;
  }
  .sub {
    margin-top: 24px;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: #555;
  }
  .en {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #999;
  }
  .dot {
    margin-top: 48px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #d0021b;
    display: inline-block;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.35); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">2048</div>
    <div class="sub">网站建设中</div>
    <div class="en">Coming Soon</div>
    <span class="dot"></span>
  </div>
</body>
</html>
