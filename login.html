<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 壹點學園 Oneness Academy</title>
<meta name="description" content="登录壹點學園会员中心。">
<link rel="icon" type="image/png" href="assets/img/logo-red-128.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261010b">
</head>
<body>

<div class="login-wrap">
  <main class="login-main">
    <div class="login-card">
      <img class="login-logo" src="assets/img/logo-red-512.png" alt="壹點學園" width="72" height="72">
      <h1>欢迎来到壹點學園</h1>
      <p class="login-sub">会员中心 · 让我们一起朝向 2048</p>

      <form class="login-form active" id="form-login" onsubmit="return doLogin(event)">
        <div class="field">
          <label for="login-user">用户名</label>
          <input id="login-user" type="text" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-pass">密码</label>
          <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button class="login-submit" type="submit">登录</button>
      </form>

      <div class="login-demo">
        测试账号：<code>test</code>　密码：<code>123456</code>
      </div>

      <a class="login-back" href="index.html">返回首页 &gt;</a>
    </div>
  </main>
</div>

<script>
function doLogin(e) {
  e.preventDefault();
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  var err = document.getElementById('login-error');
  // 演示级账号表：正式上线需替换为后端校验（见页面说明）
  var USERS = { 'test': '123456' };

  if (!u || !p) {
    err.textContent = '请输入用户名和密码';
    return false;
  }
  if (USERS[u] === p) {
    localStorage.setItem('oneness_login', JSON.stringify({ user: u, ts: Date.now() }));
    location.href = 'member.html';
  } else {
    err.textContent = '用户名或密码错误，请重试';
  }
  return false;
}
</script>
</body>
</html>
