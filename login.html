<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 壹點學園 Oneness Academy</title>
<meta name="description" content="登录壹點學園会员中心。">
<link rel="icon" type="image/png" href="assets/img/logo-red-128.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="rainbow-bar" aria-hidden="true"></div>

<div class="login-wrap">
  <main class="login-main">
    <div class="login-card">
      <img class="login-logo" src="assets/img/logo-red-512.png" alt="壹點學園" width="72" height="72">
      <h1>欢迎来到壹點學園</h1>
      <p class="login-sub">会员中心 · 让我们一起朝向 2048</p>

      <div class="login-tabs">
        <button id="tab-login" class="active" type="button">登录</button>
        <button id="tab-register" type="button">注册</button>
      </div>

      <!-- 登录表单 -->
      <form class="login-form active" id="form-login" onsubmit="return doSubmit('登录')">
        <div class="field">
          <label for="login-phone">手机号</label>
          <input id="login-phone" type="tel" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="field">
          <label for="login-code">验证码</label>
          <div class="code-row">
            <input id="login-code" type="text" placeholder="请输入验证码" maxlength="6">
            <button class="code-btn" id="login-send" type="button">获取验证码</button>
          </div>
        </div>
        <button class="login-submit" type="submit">登录</button>
      </form>

      <!-- 注册表单 -->
      <form class="login-form" id="form-register" onsubmit="return doSubmit('注册')">
        <div class="field">
          <label for="reg-name">昵称</label>
          <input id="reg-name" type="text" placeholder="给自己取个名字">
        </div>
        <div class="field">
          <label for="reg-phone">手机号</label>
          <input id="reg-phone" type="tel" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="field">
          <label for="reg-code">验证码</label>
          <div class="code-row">
            <input id="reg-code" type="text" placeholder="请输入验证码" maxlength="6">
            <button class="code-btn" id="reg-send" type="button">获取验证码</button>
          </div>
        </div>
        <button class="login-submit" type="submit">注册</button>
      </form>

      <p class="login-agree">
        登录即代表你同意 <a href="#">《用户协议》</a> 与 <a href="#">《隐私政策》</a>
      </p>
      <a class="login-back" href="index.html">返回首页 &gt;</a>
      <p class="login-note">会员系统接入中，敬请期待</p>
    </div>
  </main>
</div>

<script>
(function () {
  var tabLogin = document.getElementById('tab-login');
  var tabRegister = document.getElementById('tab-register');
  var formLogin = document.getElementById('form-login');
  var formRegister = document.getElementById('form-register');

  function switchTab(which) {
    var isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    formLogin.classList.toggle('active', isLogin);
    formRegister.classList.toggle('active', !isLogin);
  }
  tabLogin.addEventListener('click', function () { switchTab('login'); });
  tabRegister.addEventListener('click', function () { switchTab('register'); });

  function bindCode(btnId) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    var timer = null;
    btn.addEventListener('click', function () {
      if (timer) return;
      var s = 60;
      btn.disabled = true;
      btn.textContent = s + 's 后重发';
      timer = setInterval(function () {
        s--;
        if (s <= 0) {
          clearInterval(timer);
          timer = null;
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = s + 's 后重发';
        }
      }, 1000);
    });
  }
  bindCode('login-send');
  bindCode('reg-send');
})();

function doSubmit(kind) {
  alert(kind + '功能即将上线，会员系统接入中，敬请期待。');
  return false;
}
</script>
</body>
</html>
