<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 壹點學園 Oneness Academy</title>
<meta name="description" content="登录壹點學園会员中心。">
<link rel="icon" type="image/png" href="assets/img/logo-red-128.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261022a">
<script>
/* 已登录用户直达个人中心，无需再走引导页 */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('oneness_login') || 'null');
    if (s && s.user && Array.isArray(s.tags)) location.replace('member-home.html');
  } catch (e) {}
})();
</script>
<style>
  .login-actions { margin: 6px 0 14px; display: flex; flex-direction: column; gap: 12px; }
  .login-btn {
    display: block; width: 100%; text-align: center;
    padding: 13px 16px; border-radius: 12px;
    font-size: 15px; font-weight: 600; text-decoration: none;
    transition: background .15s;
  }
  .login-btn-primary { background: #c3272b; color: #fff; }
  .login-btn-primary:hover { background: #a01f23; }
  .login-btn-ghost { background: #fff; color: #c3272b; border: 1px solid #c3272b; }
  .login-btn-ghost:hover { background: rgba(195, 39, 43, .06); text-decoration: none; }
  .login-note { color: #8a8a8a; font-size: 13px; line-height: 1.6; margin: 4px 0 12px; }
</style>
</head>
<body>

<div class="login-wrap">
  <main class="login-main">
    <div class="login-card">
      <img class="login-logo" src="assets/img/logo-red-512.png" alt="壹點學園" width="72" height="72">
      <h1>欢迎来到壹點學園</h1>
      <p class="login-sub">学员中心 · 让我们一起朝向 2048</p>

      <div class="login-actions">
        <a class="login-btn login-btn-primary" href="https://oneness-academy.app.workbuddy.host/login">学员登录</a>
      </div>

      <p class="login-note">壹點學園学员后台系统已上线——账号由崔老师开通，开通后登录即可查看您的课程、个人信息与设置。</p>

      <a class="login-back" href="index.html">返回首页 &gt;</a>
    </div>
  </main>
</div>

</body>
</html>
